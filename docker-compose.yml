services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-sdw2023}
      POSTGRES_USER: ${PGUSER:-sdw2023}
      POSTGRES_PASSWORD: ${PGPASSWORD:-sdw2023}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prd
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-sdw2023}
      PGUSER: ${PGUSER:-sdw2023}
      PGPASSWORD: ${PGPASSWORD:-sdw2023}
      DDL_AUTO: ${DDL_AUTO:-update}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
